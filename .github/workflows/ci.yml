name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Secret / PII scan
        run: npm run audit:secrets
      - name: CLI smoke (no credentials needed)
        run: |
          node src/checkin.mjs --version
          node src/checkin.mjs --help | head -5
